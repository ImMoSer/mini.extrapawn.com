add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org 'wasm-unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://t.me https://*.telesco.pe https://*.telegram.org; connect-src 'self' blob: https://mini.extrapawn.com; worker-src 'self' blob:; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
