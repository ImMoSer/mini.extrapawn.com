map $request_time $mini_is_slow {
    ~^[1-9]  1;
    default  0;
}

map $status $mini_anomaly_or_slow {
    ~^[45]  1;
    default $mini_is_slow;
}

map $http_user_agent $mini_should_log {
    ~*Wget  0;
    default $mini_anomaly_or_slow;
}

log_format mini_json_anomaly escape=json
    '{"ts":"$time_iso8601","service":"mini-frontend","level":"WARN",'
    '"status":$status,"method":"$request_method","uri":"$request_uri",'
    '"req_s":$request_time,"up_s":"$upstream_response_time",'
    '"ip":"$remote_addr","bytes":$body_bytes_sent,"ua":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=mini_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=mini_engine_limit:10m rate=4r/s;
limit_req_status 429;
limit_req_log_level warn;

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1M;
    server_tokens off;

    access_log /var/log/nginx/access.log mini_json_anomaly if=$mini_should_log;

    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/mime.types;
    include /etc/nginx/security-headers.conf;

    # Block automated vulnerability scanners (.env, .git, PHP, Spring, backups)
    location ~* (?:/\.(?!well-known)|/actuator/|/wp-admin/|/wp-includes/|/phpmyadmin/|/proc/self/|\.(?:bak|co?nf|cfg|dist|env|ini|log|sh|sql|sw[op]|yml|yaml|php|jsp|asp|aspx)$) {
        return 404;
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        try_files $uri =204;
    }

    location ~* \.wasm$ {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(?:svg|jpg|jpeg|png|webp|gif|ico|mp3|wav|ogg|woff2)$ {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/security-headers.conf;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Stricter rate limit for CPU-intensive chess engine endpoints
    location ~ ^/api/(?:coach-engine/|challenges/.+/move$) {
        limit_req zone=mini_engine_limit burst=10 nodelay;
        set $upstream_backend http://extrapawn-mini-backend:3000;
        proxy_pass $upstream_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=mini_api_limit burst=30 nodelay;
        set $upstream_backend http://extrapawn-mini-backend:3000;
        proxy_pass $upstream_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
