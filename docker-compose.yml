services:
  extrapawn-mini-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: extrapawn-mini-backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    env_file:
      - path: .env_local
        required: false
      - path: .env
        required: false
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - PUZZLE_SERVICE_URL=${PUZZLE_SERVICE_URL:-http://puzzle-engine:5000}
      - MAIA_HUB_URL=${MAIA_HUB_URL:-http://engine-hub:5000}
      - TABLESERVICE_URL=${TABLESERVICE_URL:-http://tableservice:5000}
      - COACH_ENGINE_URL=${COACH_ENGINE_URL:-http://coach_sf:5000}
      - MINI_APP_URL=${MINI_APP_URL:-https://mini.extrapawn.com}
      - BOT_USERNAME=${BOT_USERNAME:-ExtraPawnTeleBot}
    networks:
      - dokploy-network

  extrapawn-mini-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: extrapawn-mini-frontend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - extrapawn-mini-backend
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

